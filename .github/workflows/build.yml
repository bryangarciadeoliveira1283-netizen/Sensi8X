
plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.sensi8x.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sensi8x.app'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['.']
            java.include 'MainActivity.java'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
